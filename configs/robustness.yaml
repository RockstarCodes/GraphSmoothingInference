base: configs/experiments.yaml
seeds: [11, 22, 33, 44, 55]
edge_dropout: [0.1, 0.3, 0.5]
edge_corruption: [0.1, 0.3]           # fraction of edges replaced by uniformly random non-edges
degree_preserving_rewiring: [0.1, 0.3] # fraction of edges swapped (double edge swap)
forest_methods: [max_jaccard, bfs, low_degree, random]
embedding_dimensions: [32, 64, 128]
train_label_fraction: [1.0, 0.5, 0.25, 0.1]
loopy_bp: {max_iter: 300, damping: 0.5, tol: 1.0e-7}
output_dir: results/metrics/robustness
